<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stash</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="logo">S</div>
        <span class="brand">Stash</span>
      </div>
      <button class="btn-icon close-btn" id="closeBtn" title="Close">✕</button>
    </div>

    <!-- State: Loading -->
    <div id="stateLoading" class="state">
      <div class="loading-spinner"></div>
    </div>

    <!-- State: Already saved -->
    <div id="stateSaved" class="state hidden">
      <div class="saved-status">
        <span class="heart-icon">♥</span>
        <span class="saved-label">Already saved</span>
      </div>
      <div class="item-card" id="savedCard">
        <img class="item-thumb" id="savedThumb" src="" alt="" />
        <div class="item-info">
          <div class="item-title" id="savedTitle"></div>
          <div class="item-domain" id="savedDomain"></div>
          <div class="item-price" id="savedPrice"></div>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Collection</label>
        <select class="select-input" id="savedCollection"></select>
        <input type="text" class="select-input new-collection-input hidden" id="savedCollectionNew" placeholder="Collection name…" autocomplete="off" />
      </div>
      <div class="toggle-row">
        <div class="toggle-info">
          <div class="toggle-label">Notify on price drop</div>
          <div class="toggle-sub" id="watchingFrom"></div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="notifyToggle" />
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="action-row">
        <button class="btn btn-primary" id="doneBtn">Done</button>
        <button class="btn btn-secondary" id="addNoteBtn">Add note</button>
      </div>
      <div class="note-area hidden" id="noteArea">
        <textarea class="note-input" id="noteInput" placeholder="Add a note..."></textarea>
        <button class="btn btn-primary btn-sm" id="saveNoteBtn">Save note</button>
      </div>
    </div>

    <!-- State: No product found -->
    <div id="stateEmpty" class="state hidden">
      <div class="empty-illustration">
        <img src="../assets/empty-state.svg" alt="" width="120" height="120" />
      </div>
      <div class="empty-heading">No products found</div>
      <div class="empty-sub">Visit a product page to save an item.</div>
    </div>

    <!-- State: On a store but no product selected -->
    <div id="stateStore" class="state hidden">
      <div class="empty-illustration">
        <img src="../assets/store-state.svg" alt="" width="120" height="120" />
      </div>
      <div class="empty-heading">You're on a shopping page</div>
      <div class="empty-sub">Click on a product to open it, then stash it.</div>
    </div>

    <!-- State: Product found, not saved -->
    <div id="stateProduct" class="state hidden">
      <div class="item-card" id="productCard">
        <img class="item-thumb" id="productThumb" src="" alt="" />
        <div class="item-info">
          <div class="item-title" id="productTitle"></div>
          <div class="item-domain" id="productDomain"></div>
          <div class="item-price" id="productPrice"></div>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Collection</label>
        <select class="select-input" id="productCollection"></select>
        <input type="text" class="select-input new-collection-input hidden" id="productCollectionNew" placeholder="Collection name…" autocomplete="off" />
      </div>
      <div class="toggle-row">
        <div class="toggle-info">
          <div class="toggle-label">Notify on price drop</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="productNotifyToggle" />
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="action-row">
        <button class="btn btn-primary btn-full" id="saveBtn">Save</button>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <a class="view-stash-link" id="viewStashLink" href="#">View stash →</a>
      <button class="btn btn-outline" id="saveManuallyBtn">Save manually</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
