<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stash — Saved Items</title>
  <link rel="stylesheet" href="stash.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div class="header-inner">
        <div class="logo-row">
          <div class="logo">S</div>
          <span class="brand">Stash</span>
        </div>
        <div class="header-actions">
          <input class="search-input" id="searchInput" type="text" placeholder="Search saved items…" />
        </div>
      </div>
    </header>

    <main class="main">
      <div class="toolbar">
        <span class="item-count" id="itemCount">0 items</span>
        <select class="filter-select" id="collectionFilter">
          <option value="">All collections</option>
        </select>
      </div>

      <div class="grid" id="grid"></div>

      <div class="empty-page hidden" id="emptyPage">
        <img src="assets/empty-state.svg" alt="" width="140" height="140" />
        <p class="empty-heading">Your stash is empty</p>
        <p class="empty-sub">Browse online stores and save products with the Stash extension.</p>
      </div>
    </main>
  </div>
  <script src="stash.js"></script>
</body>
</html>
